<!doctype html>
<!-- Modified for Zetalvx Image Lab Qwen 1.0.52: interface/localization only; Apache-2.0, retained NOTICE. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · Zetalvx Image Lab — Qwen 2.1 Edition</title>
<link rel="icon" type="image/png" href="/static/zetalvx-logo.png?v=1.0.76">
<link rel="stylesheet" href="/static/style.css?v=1.0.76">
<script src="/static/qwen-catalog.js?v=1.0.76"></script><script src="/static/i18n.js?v=1.0.76"></script><link rel="stylesheet" href="/static/studio-additions.css?v=1.0.76"><link rel="stylesheet" href="/static/release-polish.css?v=1.0.76">
</head>
<body data-auth-title="Login" class="creator-login-page">
  <label class="auth-language"><span>Language</span><select data-language-picker aria-label="Language"></select></label><main class="creator-login-card">
    <div class="creator-login-brand"><a class="brand-logo-link" href="/" aria-label="Home"><img src="/static/zetalvx-logo.png?v=1.0.76" alt="Zetalvx"></a><div><b data-no-i18n>ZETALVX IMAGE LAB</b><small data-no-i18n>Qwen 2.1 Edition · Zetalvx Labs</small></div></div>
    <div class="creator-login-copy">
      <span class="eyebrow">LOGIN</span>
      <h1>Accedi a Zetalvx Image Lab</h1>
      <p>Accedi con l'account locale creato al primo avvio.</p>
    </div>
    {% if error %}<div class="creator-login-error">{{ error }}</div>{% endif %}
    <form method="post" class="creator-login-form" autocomplete="on">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label>Utente<input name="username" value="{{ username }}" autocomplete="username" autofocus required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary big" type="submit">Login</button>
    </form>
    <small class="creator-login-foot">Puoi cambiare utente e password da <b>Settings → Account</b>.</small>
  </main>
</body>
</html>
